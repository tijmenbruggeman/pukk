# Pukk web app for Synology Container Manager (Project > Create, paste this).
# Put it behind DSM's reverse proxy with https: Web Bluetooth needs https.
services:
  pukk:
    image: ghcr.io/tijmenbruggeman/pukk-app:latest
    container_name: pukk
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # The one password for the app. Changing it logs everyone out.
      PUKK_PASSWORD: "verander-mij"
    volumes:
      # Packs (SQLite) and the session secret. A named volume avoids
      # permission problems; to use a shared folder instead, mount it here and
      # make it writable for uid 1000 (the container's "node" user).
      - pukk-data:/data

volumes:
  pukk-data:
